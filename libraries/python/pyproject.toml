[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-fuel-prices"
version = "1.0.0"
description = "Python client for the daily-refreshed world fuel prices open data API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "aykutsp" }]
keywords = ["fuel-prices", "gasoline", "diesel", "lpg", "open-data", "world"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://aykutsp.github.io/world-fuel-prices/"
Repository = "https://github.com/aykutsp/world-fuel-prices"
Issues = "https://github.com/aykutsp/world-fuel-prices/issues"

[tool.setuptools]
packages = ["world_fuel_prices"]
